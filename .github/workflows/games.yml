name: Generate arcade games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate contribution graph games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,snake,tetris"
          hide_month_labels: "false"

      - name: Alias dark variants to published names
        run: |
          for f in dist/*-contribution-graph-dark.svg; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            cp "$f" "dist/dark-${base%-contribution-graph-dark.svg}-contribution-graph.svg"
          done

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
